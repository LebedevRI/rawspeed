on:
  workflow_call:
    inputs:
      sanitizer:
        required: true
        type: string
      fuzzing_engine:
        required: true
        type: string

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: (OSS-FUZZ) Building with ${{ inputs.sanitizer }} sanitizer, with ${{ inputs.fuzzing_engine }} fuzzing engine
        id: build
        uses: LebedevRI/oss-fuzz/infra/cifuzz/actions/build_fuzzers@cifuzz
        with:
          oss-fuzz-project-name: 'librawspeed'
          dry-run: false
          language: c++
          sanitizer: ${{ inputs.sanitizer }}
          fuzzing_engine: ${{ inputs.fuzzing_engine }}
      - name: (OSS-FUZZ) Running ${{ inputs.sanitizer }}-sanitized fuzzers, with ${{ inputs.fuzzing_engine }} fuzzing engine
        uses: LebedevRI/oss-fuzz/infra/cifuzz/actions/run_fuzzers@cifuzz
        with:
          oss-fuzz-project-name: 'librawspeed'
          fuzz-seconds: 600
          dry-run: false
          sanitizer: ${{ inputs.sanitizer }}
          fuzzing_engine: ${{ inputs.fuzzing_engine }}
      - name: Upload Crash
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        if: failure() && steps.build.outcome == 'success'
        with:
          name: artifacts
          path: ./out/artifacts
